name: עדכון יומי של האירועים

on:
  schedule:
    - cron: "13 5 * * *"   # כל בוקר ב-7:13 שעון ישראל (בחורף; בקיץ 8:13)
  workflow_dispatch:        # מאפשר להריץ ידנית מהלשונית Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run update
      - name: שמירת הנתונים החדשים
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet || git commit -m "עדכון אירועים $(TZ=Asia/Jerusalem date +'%d.%m %H:%M')"
          git push
